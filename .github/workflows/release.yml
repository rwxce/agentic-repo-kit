name: Release

# Squashes the current dev into ONE commit on main ("release: vX.Y.Z"), tags it, publishes the
# GitHub release from the CHANGELOG section and redeploys the site. main only ever holds release
# commits; the full history lives on dev. See BRANCHING.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v (e.g. 0.6.0). CHANGELOG.md must have a '## <version> — <date>' section."
        required: true

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Only from dev
        if: github.ref != 'refs/heads/dev'
        run: |
          echo "::error::Run the release from the dev branch (got $GITHUB_REF)."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate version and changelog
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be X.Y.Z without a leading v (got '$VERSION')."; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists."; exit 1
          fi
          if ! grep -q "^## $VERSION " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $VERSION — <date>' section on dev."; exit 1
          fi

      - name: Squash dev onto main, tag and publish
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          commit=$(git commit-tree "HEAD^{tree}" -p origin/main -m "release: v$VERSION")
          git push origin "$commit:refs/heads/main"
          git tag "v$VERSION" "$commit"
          git push origin "v$VERSION"
          awk -v v="$VERSION" '$0 ~ "^## "v" " {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md
          gh release create "v$VERSION" --title "v$VERSION" --notes-file notes.md --verify-tag
          # Pushes made with GITHUB_TOKEN don't trigger other workflows; workflow_dispatch does.
          gh workflow run pages.yml --ref main
