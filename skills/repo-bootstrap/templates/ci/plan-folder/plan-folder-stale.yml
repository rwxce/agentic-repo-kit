# WHAT: Weekly, opens one issue per plan folder untouched for MAX_AGE_DAYS on the integration
#   branch. It never deletes anything: closing an initiative needs a person to decide what to keep.
#   Closing the issue means "still active" and silences the folder until its next change.
# REPO SIGNAL: plan folders under `docs/plans/` (see `plan-folder-gate.yml`); initiatives that stall
#   leave a folder nobody owns, which agents then read as current truth.
# CONFIGURE: BRANCH, PLANS_DIR, MAX_AGE_DAYS, the cron, the runner label. Both the schedule and a
#   manual run need this file on the repository's default branch.
name: Plan folder stale check

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: plan-folder-stale
  cancel-in-progress: false

jobs:
  flag-stale-plans:
    runs-on: ubuntu-latest # <or your faster runner label>
    steps:
      - name: Open an issue for each stale plan folder
        uses: actions/github-script@v8
        env:
          BRANCH: <integration-branch>
          PLANS_DIR: docs/plans
          MAX_AGE_DAYS: '30'
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { BRANCH, PLANS_DIR } = process.env;
            const cutoff = Date.now() - Number(process.env.MAX_AGE_DAYS) * 86_400_000;

            let entries;
            try {
              ({ data: entries } = await github.rest.repos.getContent({ owner, repo, path: PLANS_DIR, ref: BRANCH }));
            } catch (error) {
              if (error.status === 404) {
                core.info(`${PLANS_DIR} does not exist on ${BRANCH}; nothing to check.`);
                return;
              }
              throw error;
            }

            // Open and closed issues both count: closing the issue means "still active", and it
            // must not come back next week. A closed one only silences the folder until the
            // folder's next change makes it stale again (checked below against `lastChange`).
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'all',
              per_page: 100,
            });
            const openTitles = new Set();
            const lastClosedAt = new Map();
            for (const issue of issues) {
              if (issue.pull_request) continue;
              if (issue.state === 'open') openTitles.add(issue.title);
              else if (issue.closed_at) {
                const closed = new Date(issue.closed_at).getTime();
                if (closed > (lastClosedAt.get(issue.title) ?? 0)) lastClosedAt.set(issue.title, closed);
              }
            }

            for (const folder of entries.filter((entry) => entry.type === 'dir')) {
              const { data: commits } = await github.rest.repos.listCommits({
                owner,
                repo,
                sha: BRANCH,
                path: folder.path,
                per_page: 1,
              });
              const lastChange = commits[0]?.commit.committer?.date;
              if (!lastChange || new Date(lastChange).getTime() >= cutoff) continue;

              const title = `Stale plan: ${folder.name}`;
              if (openTitles.has(title)) continue;
              if ((lastClosedAt.get(title) ?? 0) > new Date(lastChange).getTime()) continue;
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body:
                  `\`${folder.path}/\` has not changed since ${lastChange.slice(0, 10)}.\n\n` +
                  'If the initiative is finished, close it in a PR: promote what must outlive it, delete the folder ' +
                  'and add a `Closes-plan` line (plan-feature skill, `references/plan-folder.md`). ' +
                  'If it is still active, close this issue.',
              });
              core.info(`Opened "${title}".`);
            }
