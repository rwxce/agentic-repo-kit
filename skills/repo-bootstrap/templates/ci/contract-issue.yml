# WHAT: Safety net after merge. For each migration a merged PR defines, opens a "Contract: <name>"
#   issue (if none is open) with the expand -> migrate -> contract checklist, so the destructive
#   "contract" step is tracked even when the pre-merge gate was bypassed.
# REPO SIGNAL: schema migrations defined in one registry file AND expand/migrate/contract for
#   deprecations. Pair it with `migration-contract-gate.yml` (the primary, pre-merge control).
# CONFIGURE: `branches`, MIGRATIONS_FILE, DEFINITION_REGEX (group 1 = migration name), LABEL,
#   BOT_ASSIGNEE (a human login used when the PR author is a bot), the checklist lines.
name: Contract issue

on:
  # Runs the trusted workflow from the base branch. This job never checks out or executes code
  # from the pull request; it only reads the PR's file list through the API.
  pull_request_target:
    types: [closed]
    branches: [<integration-branch>]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  open-contract-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest # <or your faster runner label>
    steps:
      - name: Open a "Contract" issue for each migration the PR defines
        uses: actions/github-script@v7
        env:
          MIGRATIONS_FILE: <path/to/migrations-file>
          # Matches ADDED lines of the unified diff; group 1 is the migration name.
          DEFINITION_REGEX: '^\+export const (\w+) = <migrations>\.define'
          LABEL: schema-contract
          BOT_ASSIGNEE: <maintainer-login>
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { MIGRATIONS_FILE, DEFINITION_REGEX, LABEL, BOT_ASSIGNEE } = process.env;
            const label = { name: LABEL, color: '5319e7' };

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const file = files.find((f) => f.filename === MIGRATIONS_FILE);
            if (!file) return;
            if (file.patch === undefined) {
              // Fail loud: a huge diff has no patch, and silently skipping would lose the issue.
              core.setFailed(`${MIGRATIONS_FILE} has no patch in the API response (file too large); open the issue by hand.`);
              return;
            }

            const names = [...file.patch.matchAll(new RegExp(DEFINITION_REGEX, 'gm'))].map((m) => m[1]);
            if (names.length === 0) return;

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              labels: label.name,
              state: 'open',
              per_page: 100,
            });
            const openTitles = new Set(openIssues.map((issue) => issue.title));

            try {
              await github.rest.issues.getLabel({ owner, repo, name: label.name });
            } catch (error) {
              if (error.status !== 404) throw error;
              try {
                await github.rest.issues.createLabel({ owner, repo, ...label });
              } catch (createError) {
                // Another run may create the label between the GET and POST.
                if (createError.status !== 422) throw createError;
              }
            }

            // Bots/Apps cannot always be assigned.
            const assignee = pr.user.type === 'Bot' ? BOT_ASSIGNEE : pr.user.login;

            for (const name of names) {
              const title = `Contract: ${name}`;
              if (openTitles.has(title)) {
                core.info(`Issue "${title}" already open; skipping.`);
                continue;
              }
              const body = [
                `Migration \`${name}\` was defined in #${pr.number}. Schema changes follow expand -> migrate -> contract.`,
                '',
                `- [ ] Expand shipped (schema permissive, migration defined) — #${pr.number}`,
                `- [ ] Migration registered where the deploy runs it (\`${MIGRATIONS_FILE}\`)`,
                '- [ ] Deployed to production and the migration ran there',
                `- [ ] Migration status reports \`${name}\` as done in every environment (<status command>)`,
                '- [ ] Backup taken before the destructive step',
                `- [ ] Contract PR: tighten/remove the schema entry, delete \`${name}\` from the registry, and close this issue`,
                '',
                `Marker in the schema: \`DEPRECATED — contract: ${name}\``,
              ].join('\n');
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: [label.name],
                assignees: assignee && !assignee.startsWith('<') ? [assignee] : [],
              });
              core.info(`Created "${title}".`);
            }
